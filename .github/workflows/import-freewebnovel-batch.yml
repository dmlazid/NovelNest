name: Import authorized FreeWebNovel batch

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "scripts/import_freewebnovel_batch.py"
      - "scripts/discover_auto_novels.py"
      - "scripts/auto_freewebnovel.json"
      - "scripts/auto_import_policy.json"
      - ".github/workflows/import-freewebnovel-batch.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # Stable per-source queue: do not version this name.
  group: novelnest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    # Authorized already-published titles may resume incremental chapter updates.
    # Publication safeguards in scripts/auto_import_policy.json continue to block
    # automatic release of newly discovered titles pending manual review.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FWN_BATCH_SIZE: "100"
      FWN_REQUEST_DELAY: "0.8"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 Pillow

      - name: Verify automatic publication safeguards
        run: python -m unittest discover -s scripts -p "test_publication_guard.py"
      - name: Import FreeWebNovel queue and prepare the next 15-title batch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mapfile -t series < <(python scripts/import_freewebnovel_batch.py --keys)
          echo "FreeWebNovel queue contains ${#series[@]} titles."

          start_time="$(date +%s)"
          runtime_budget=9000
          pass=0

          push_with_rebase() {
            pushed=0
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Rebase raced with another updater; retrying ($attempt/5)..."
                sleep 3
                continue
              fi
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "Push raced with another updater; retrying ($attempt/5)..."
              sleep 3
            done
            if [ "$pushed" -ne 1 ]; then
              echo "Could not push after 5 attempts."
              return 1
            fi
          }

          queue_continuation() {
            echo "Queueing an immediate continuation run for FreeWebNovel..."
            gh workflow run import-freewebnovel-batch.yml --ref main || \
              echo "Could not queue continuation; the six-hour schedule will retry."
          }

          while true; do
            pass=$((pass + 1))
            echo "=== FreeWebNovel round-robin pass $pass ==="
            pass_progress=0
            pass_failures=0

            for key in "${series[@]}"; do
              elapsed=$(( $(date +%s) - start_time ))
              if [ "$elapsed" -ge "$runtime_budget" ]; then
                echo "Safe runtime budget reached after ${elapsed}s."
                gh workflow run pages.yml --ref main || echo "A later Pages run can publish saved checkpoints."
                queue_continuation
                exit 0
              fi

              echo "=== FreeWebNovel import: $key ==="
              if ! python scripts/import_freewebnovel_batch.py "$key"; then
                echo "WARNING: $key failed this pass; continuing with the remaining titles."
                pass_failures=$((pass_failures + 1))
                continue
              fi

              node scripts/check.mjs

              git add -A -- \
                "dist/data/fwn-$key-chapters-"*.js \
                "dist/assets/fwn-$key.jpg" \
                "dist/licensed-fwn-$key.js" \
                dist/index.html 2>/dev/null || true

              if git diff --cached --quiet; then
                echo "$key is caught up for this source snapshot."
                continue
              fi

              pass_progress=1
              git commit -m "Auto-update FreeWebNovel $key (pass $pass)"
              push_with_rebase || exit 1
              echo "$key checkpoint saved."
            done

            if [ "$pass_progress" -eq 0 ]; then
              if [ "$pass_failures" -gt 0 ]; then
                echo "$pass_failures title(s) could not be checked. No new batch will be selected until all current titles can be checked."
                exit 0
              fi

              before_count="${#series[@]}"
              echo "All current FreeWebNovel titles are caught up."
              echo "Discovering the next popular 15-title candidate batch..."
              python scripts/discover_auto_novels.py freewebnovel --limit 15 --promote

              mapfile -t next_series < <(python scripts/import_freewebnovel_batch.py --keys)
              after_count="${#next_series[@]}"

              git add scripts/candidates_freewebnovel.json scripts/auto_freewebnovel.json
              if ! git diff --cached --quiet; then
                if [ "$after_count" -gt "$before_count" ]; then
                  git commit -m "Queue next automatic FreeWebNovel batch of 15"
                else
                  git commit -m "Refresh pending FreeWebNovel candidate batch"
                fi
                push_with_rebase || exit 1
              fi

              if [ "$after_count" -gt "$before_count" ]; then
                echo "A new authorized 15-title FreeWebNovel batch was promoted."
                queue_continuation
              else
                echo "No new titles were promoted. Candidate selection is saved and the authorization gate remains in effect."
              fi
              exit 0
            fi

            echo "Round $pass saved new checkpoints. Queueing one Pages deployment..."
            gh workflow run pages.yml --ref main || echo "A later Pages run can publish saved checkpoints."
          done

      - name: Record updater result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "FreeWebNovel batch updater result: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Titles advance in 100-chapter checkpoints. After the current queue is fully caught up, NovelNest discovers a 15-title popular candidate batch. Promotion only occurs when source-wide authorization is enabled." >> "$GITHUB_STEP_SUMMARY"
