name: Import licensed Cultivation Online

on:
  schedule:
    - cron: "27 */6 * * *"
  push:
    paths:
      - "scripts/import_cultivation.py"
      - ".github/workflows/import-cultivation.yml"
      - "scripts/run_novel_catchup.sh"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # Stable per-source queue: do not version this name.
  group: novelnest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    # Resume authorized chapter checkpoints; public D1 cutover stays gated.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Catch Cultivation Online up with resumable validated checkpoints
        env:
          CULTIVATION_BATCH_SIZE: "100"
          IMPORT_NAME: "Cultivation Online"
          IMPORT_COMMAND: "python scripts/import_cultivation.py"
          IMPORT_GIT_PATHS: "dist/data/cultivation-chapters-*.js dist/assets/cultivation-online.jpg dist/licensed-cultivation.js"
          IMPORT_MAX_CHECKPOINTS: "22"
          IMPORT_MAX_SECONDS: "9600"
          IMPORT_COMMIT_PREFIX: "Auto-update Cultivation Online chapters"
          IMPORT_WORKFLOW: "import-cultivation.yml"
          IMPORT_RESCHEDULE: "true"
          IMPORT_DEPLOY_EACH_CHECKPOINT: "false"
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/run_novel_catchup.sh

      - name: Record updater result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "Cultivation Online updater result: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Each successful checkpoint is committed before the next batch begins." >> "$GITHUB_STEP_SUMMARY"
          echo "Existing published chapters are never removed when the source temporarily reports fewer chapters." >> "$GITHUB_STEP_SUMMARY"
