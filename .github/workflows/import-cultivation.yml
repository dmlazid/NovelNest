name: Import licensed Cultivation Online

on:
  schedule:
    - cron: "27 */6 * * *"
  push:
    paths:
      - "scripts/import_cultivation.py"
      - ".github/workflows/import-cultivation.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: cultivation-freewebnovel-v5
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Import and checkpoint Cultivation Online
        env:
          CULTIVATION_BATCH_SIZE: "100"
          CULTIVATION_BATCHES_PER_RUN: "22"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          batches="${CULTIVATION_BATCHES_PER_RUN:-22}"
          for batch in $(seq 1 "$batches"); do
            echo "=== Cultivation catch-up checkpoint $batch/$batches ==="
            python scripts/import_cultivation.py
            node scripts/check.mjs

            git add -A -- dist/data dist/assets/cultivation-online.jpg dist/licensed-cultivation.js
            if git diff --cached --quiet; then
              echo "Cultivation Online is already caught up. Nothing else to commit."
              exit 0
            fi

            git commit -m "Auto-update Cultivation Online chapters (checkpoint $batch)"

            pushed=0
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "Push raced with another update; retrying ($attempt/3)..."
              sleep 2
            done

            if [ "$pushed" -ne 1 ]; then
              echo "Could not push Cultivation checkpoint after 3 attempts."
              exit 1
            fi

            echo "Queueing NovelHaven deployment for Cultivation checkpoint $batch..."
            gh workflow run pages.yml --ref main || {
              echo "Checkpoint was saved; final workflow completion will still publish it."
            }
          done

      - name: Record updater result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "Cultivation Online updater result: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Each successful checkpoint is committed before the next batch begins." >> "$GITHUB_STEP_SUMMARY"
          echo "Existing published chapters are never removed when the source temporarily reports fewer chapters." >> "$GITHUB_STEP_SUMMARY"
