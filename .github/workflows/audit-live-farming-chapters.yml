name: Audit live novel chapter availability
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-live-farming-chapters.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live chapter 17 18 19 and metadata (read-only)
        shell: bash
        run: |
          set -euo pipefail
          origin='https://novelhaven.top'
          id='farming-cultivating-immortality'
          for p in "/" "/novel/$id/" "/novel/$id/chapter-17/" "/novel/$id/chapter-18/" "/novel/$id/chapter-19/" "/licensed-akk-farming-immortality.js" "/data/akk-farming-immortality-chapters-01.js" "/_internal/novels.json"; do
            tmp="$(mktemp)"
            status=$(curl -LsS --connect-timeout 12 --max-time 25 -A 'NovelHaven-Live-Audit/1.0' -H 'Cache-Control: no-cache' -o "$tmp" -w '%{http_code}' "$origin$p?novelhaven-audit=20261011" || echo 000)
            size=$(wc -c < "$tmp")
            chapter='no'
            if grep -q 'data-static-chapter="farming-cultivating-immortality"' "$tmp"; then chapter='yes'; fi
            failed='no'
            if grep -q 'This chapter is temporarily unavailable\|This chapter could not load\|Page not found' "$tmp"; then failed='yes'; fi
            app=$(grep -Eo 'src="app.js\?v=[^"]+' "$tmp" | head -1 || true)
            count=$(grep -Eo '"number":19' "$tmp" | wc -l || true)
            echo "LIVE_CHECK path=$p status=$status bytes=$size readable_static_chapter=$chapter failure_body=$failed app_version=$app chapter19_mention=$count"
            if [ "$p" = "/novel/$id/chapter-18/" ] || [ "$p" = "/novel/$id/chapter-19/" ]; then
              echo "CHAPTER_FIRST_BYTES_$(basename "$p")=$(head -c 200 "$tmp" | tr '\n' ' ' | sed 's/</[/g')"
            fi
            rm -f "$tmp"
          done
      - name: Verify browser actually displays chapter text on both URLs
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then echo "Browser unavailable"; exit 1; fi
          for num in 17 18 19; do
            page="/tmp/farming-live-chapter-$num.html"
            timeout 85s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
              --disable-background-networking --disable-extensions --virtual-time-budget=18000 \
              --dump-dom "https://novelhaven.top/novel/farming-cultivating-immortality/chapter-$num/?audit-browser=1" > "$page" 2>"/tmp/farming-browser-$num.log" || true
            echo "BROWSER chapter=$num bytes=$(wc -c < "$page")"
            if grep -q 'This chapter could not load' "$page"; then echo "BROWSER_STATUS $num FAILED_CANNOT_LOAD"; fi
            if grep -q 'Loading chapter…' "$page"; then echo "BROWSER_STATUS $num STILL_LOADING"; fi
            if grep -q 'Chapter $num:' "$page" && ! grep -q 'This chapter could not load' "$page"; then echo "BROWSER_STATUS $num VISIBLE_TITLE"; fi
            if [ "$num" = 18 ] && ! grep -Fq 'The Qin family had only recently embarked on the path of cultivation.' "$page"; then
              echo "::error::Chapter 18 is still not rendering real text on the live reader."
              exit 1
            fi
            if [ "$num" = 19 ] && ! grep -Fq 'The Condensing Dew Grass was in worse shape with each passing day.' "$page"; then
              echo "::error::Chapter 19 is still not rendering real text on the live reader."
              exit 1
            fi
            echo "BROWSER_ERRORS $num:"
            grep -Ei 'ERR_|Uncaught|SyntaxError|TypeError|ReferenceError|Failed to load' "/tmp/farming-browser-$num.log" | head -n 8 || true
          done
      - name: Verify both phones can access the current 19-chapter catalog and retry loader
        shell: bash
        run: |
          set -euo pipefail
          index=$(mktemp)
          catalog=$(mktemp)
          loader=$(mktemp)
          for attempt in 1 2 3; do
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' 'https://novelhaven.top/?probe=chapter19' -o "$index"
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' 'https://novelhaven.top/licensed-akk-farming-immortality.js?probe=chapter19' -o "$catalog"
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' 'https://novelhaven.top/lazy-chapters.js?probe=chapter19' -o "$loader"
            if grep -q 'licensed-akk-farming-immortality.js' "$index" &&
              grep -q '"number":19' "$catalog" &&
              grep -q 'MAX_ATTEMPTS = 3' "$loader"; then
              echo 'VERIFIED LIVE: latest catalog has chapter 19 and automatic chapter retry loader is available.'
              exit 0
            fi
            sleep 5
          done
          echo '::error::Live novel catalog or retry loader is missing.'
          exit 1
