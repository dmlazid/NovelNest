name: Import licensed Investing novel

on:
  schedule:
    - cron: "37 */6 * * *"
  push:
    paths:
      - "scripts/import_investing.py"
      - ".github/workflows/import-investing.yml"
      - "scripts/run_novel_catchup.sh"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # Stable per-source queue: do not version this name.
  group: novelnest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    # Chapter imports remain independent of the pending read-only D1 cutover.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Catch Investing In My Three Crippled Wives up in validated chapter checkpoints
        env:
          INVESTING_BATCH_SIZE: "100"
          IMPORT_NAME: "Investing In My Three Crippled Wives"
          IMPORT_COMMAND: "python scripts/import_investing.py"
          IMPORT_GIT_PATHS: "dist/data/investing-chapters-*.js dist/assets/investing-in-my-three-crippled-wives-get-10000x-times-return.jpg dist/licensed-investing.js dist/index.html"
          IMPORT_MAX_CHECKPOINTS: "24"
          IMPORT_MAX_SECONDS: "4800"
          IMPORT_COMMIT_PREFIX: "Auto-update Investing In My Three Crippled Wives chapters"
          IMPORT_WORKFLOW: "import-investing.yml"
          IMPORT_RESCHEDULE: "true"
          IMPORT_DEPLOY_EACH_CHECKPOINT: "false"
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/run_novel_catchup.sh

      - name: Record updater result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "Investing novel updater result: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "The importer validates a continuous chapter sequence before committing." >> "$GITHUB_STEP_SUMMARY"
