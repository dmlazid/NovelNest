name: Synchronize updater queues
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-*.yml'
      - '.github/workflows/sync-updaters.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: synchronize-novel-updaters
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Only stop updater jobs when their own workflow changed
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const current = (await github.rest.actions.getWorkflowRun({...repo, run_id: context.runId})).data;
            const paths = new Set([
              '.github/workflows/import-akknovel.yml', '.github/workflows/import-freewebnovel-batch.yml',
              '.github/workflows/import-gallery.yml', '.github/workflows/import-astral.yml',
              '.github/workflows/import-cultivation.yml', '.github/workflows/import-investing.yml',
              '.github/workflows/import-ongoing.yml', '.github/workflows/import-supreme-magus.yml',
              '.github/workflows/import-innkeeper.yml'
            ]);
            // Do not cancel unrelated live importers when a different novel
            // updater is changed: their already-validated checkpoints must continue.
            const changedWorkflows = new Set();
            if (context.eventName === 'push' && context.payload.before && !/^0+$/.test(context.payload.before)) {
              const diff = await github.rest.repos.compareCommits({...repo,base:context.payload.before,head:context.sha});
              for (const file of diff.data.files || []) if (paths.has(file.filename)) changedWorkflows.add(file.filename);
            }
            const obsolete = [];
            for (const status of ['in_progress','queued','pending']) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {...repo,status,per_page:100});
              for (const run of runs) {
                if (changedWorkflows.has(run.path) && run.head_branch === 'main' && run.head_sha !== context.sha && run.created_at < current.created_at) obsolete.push(run);
              }
            }
            const unique = [...new Map(obsolete.map(run => [run.id,run])).values()];
            for (const run of unique) {
              core.info(`Stopping obsolete ${run.name} #${run.run_number}; committed chapter checkpoints remain saved.`);
              try { await github.rest.actions.cancelWorkflowRun({...repo,run_id:run.id}); }
              catch (error) { if(error.status !== 409) throw error; }
            }
            // Wait until old processes have released their working copies before restarting.
            for(let attempt=0;attempt<24;attempt++) {
              const states=await Promise.all(unique.map(run=>github.rest.actions.getWorkflowRun({...repo,run_id:run.id})));
              if(states.every(r=>r.data.status==='completed')) break;
              if(attempt===23) throw new Error('Old updater still stopping; rerun synchronization before restarting it.');
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            await core.summary.addHeading('Updater coordination').addRaw(`${unique.length} obsolete jobs for changed workflows stopped. All unrelated chapter downloads continue normally.`).write();
