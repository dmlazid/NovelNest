name: Import ongoing FreeWebNovel books

on:
  schedule:
    - cron: "7 */6 * * *"
  push:
    paths:
      - "scripts/import_ongoing_freewebnovel.py"
      - ".github/workflows/import-ongoing.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Stable per-source queue: do not version this name.
  group: novelnest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Check for new chapters
        run: python scripts/import_ongoing_freewebnovel.py

      - name: Validate imported chapter data
        run: node scripts/check.mjs

      - name: Commit ongoing novel updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/monarch-chapters-*.js dist/licensed-monarch.js
          git add dist/data/signin-chapters-*.js dist/licensed-signin.js
          git add dist/data/luna-chapters-*.js dist/licensed-luna.js
          git add dist/data/sss-chapters-*.js dist/licensed-sss.js
          if git diff --cached --quiet; then
            echo "No new ongoing chapters to commit."
            exit 0
          fi
          git commit -m "Auto-update ongoing novel chapters"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another update; retrying ($attempt/3)..."
            sleep 2
          done
          exit 1
