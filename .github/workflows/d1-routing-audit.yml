name: Audit five D1 chapter shards (read-only)

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit-d1-routing.mjs"
      - "scripts/audit-d1-routing.test.mjs"
      - ".github/workflows/d1-routing-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novelhaven-d1-routing-audit
  cancel-in-progress: false

jobs:
  routing-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out published chapter sources
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test safe five-database routing preview
        run: node --test scripts/audit-d1-routing.test.mjs scripts/audit-d1-account.test.mjs
      - name: Verify provisioned shards and preview placements (read-only)
        env:
          D1_ROUTING_PREVIEW_OUT: ${{ runner.temp }}/novelhaven-d1-routing-preview.json
        run: node scripts/audit-d1-routing.mjs
      - name: Save routing preview for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novelhaven-d1-routing-preview
          path: ${{ runner.temp }}/novelhaven-d1-routing-preview.json
          if-no-files-found: ignore
          retention-days: 7
