name: Publish verified NovelHaven compatible Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-compatible-pages-production.yml'
      - 'scripts/build-compatible-pages.mjs'
      - 'scripts/source-feed-fingerprint.mjs'
      - 'scripts/verify-live-source-feed.mjs'
      - 'dist/source-activity.js'
      - 'dist/app.js'
      - 'dist/index.html'
      - 'dist/about.html'
      - 'dist/contact.html'
      - 'dist/copyright.html'
      - 'dist/editorial-policy.html'
      - 'dist/content-licensing.html'
      - 'dist/advertising-disclosure.html'
      - 'dist/privacy.html'
      - 'dist/privacy-choices.html'
      - 'dist/terms.html'
      - 'scripts/policy-compliance.test.mjs'
      - 'scripts/verify-live-policy-pages.mjs'
      - 'scripts/check-compatible-pages.mjs'
      - 'scripts/novel-ad-policy.mjs'
      - 'scripts/novel-monetization-reviews.json'
      - 'scripts/verify-live-novel-ad-hold.mjs'
      - 'scripts/purge-policy-cache.mjs'
      - 'scripts/audit-novel-ads.mjs'
      - 'cloudflare/reader/worker.mjs'
  workflow_run:
    workflows: ['Check source chapter activity']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: novelhaven-verified-pages-direct-production
  cancel-in-progress: false
jobs:
  deploy:
    # Scheduled scanner commits use GITHUB_TOKEN, so GitHub suppresses
    # ordinary push workflows. workflow_run publishes the successful scan.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test real source release ordering and chapter safeguards
        run: node --test scripts/home-feed.test.mjs scripts/chapter-duplicates.test.mjs scripts/policy-compliance.test.mjs scripts/novel-ad-policy.test.mjs scripts/discovery-curation.test.mjs
      - name: Build existing reader-compatible Pages package
        run: |
          node scripts/build-compatible-pages.mjs
          node scripts/check-compatible-pages.mjs
      - name: Confirm this exact Cloudflare project and original domain (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/guard-compatible-pages-production.mjs
      - name: Upload only verified dist to existing Pages production branch
        id: pages_upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name novelnest --branch main
      - name: Verify new homepage, source chronology, reader and ads.txt live
        if: always() && steps.pages_upload.outcome == 'success'
        run: node scripts/verify-live-source-feed.mjs
      - name: Refresh only stale NovelHaven policy and novel routes
        if: always() && steps.pages_upload.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/purge-policy-cache.mjs
      - name: Verify ordinary and restricted novel routes do not request Google-served ads
        if: always() && steps.pages_upload.outcome == 'success'
        run: node scripts/verify-live-novel-ad-hold.mjs
      - name: Verify published copyright, contact, privacy and policy pages are ad-free
        if: always() && steps.pages_upload.outcome == 'success'
        run: node scripts/verify-live-policy-pages.mjs
