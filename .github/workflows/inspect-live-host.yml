name: Inspect NovelHaven live hosting
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-live-host.yml"
      - "scripts/inspect-live-host.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Query public site and read-only deployment metadata
        run: node scripts/inspect-live-host.mjs
