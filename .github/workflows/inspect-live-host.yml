name: Inspect NovelHaven live hosting
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-live-host.yml"
      - "scripts/inspect-live-host.mjs"
      - "dist/index.html"
      - "dist/app.js"
      - "dist/source-activity.js"
      - "dist/styles.css"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # This is a read-only remote inspection. Avoid downloading the huge
      # chapter catalog just to execute one small diagnosis script.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/inspect-live-host.mjs
            dist/index.html
            dist/source-activity.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Query public site and read-only deployment metadata
        run: node scripts/inspect-live-host.mjs
      - name: Check real homepage rendering in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then
            echo "No system headless Chrome found. Only HTTP checks were completed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for page in https://novelhaven.top/; do
            echo "Rendering $page with $BROWSER"
            set +e
            timeout 110s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-networking --disable-extensions --virtual-time-budget=35000 --dump-dom "$page" > /tmp/novelhaven-dom.html 2> /tmp/novelhaven-chrome-errors.log
            code=$?
            set -e
            echo "Headless Chrome exit: $code | DOM bytes: $(wc -c < /tmp/novelhaven-dom.html)"
            if grep -Eq 'AkkNovel Spotlight|AkkNovel pick|More From AkkNovel|AkkNovel Collection|Explore all AkkNovel stories' /tmp/novelhaven-dom.html; then
              echo "UNWANTED: source promotion labels still showing."
              echo "- Live homepage still contains unwanted source-branding." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            elif grep -q 'class="home-top-feature"' /tmp/novelhaven-dom.html && grep -q 'after-rebirth-i-was-forced-to-become-the-mafia-princess' /tmp/novelhaven-dom.html; then
              echo "CONFIRMED: hand-picked novels appear first without origin labels."
              echo "- Live homepage shows the first featured story with no source-branding." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "NOT YET UPDATED: expected first featured novel missing."
              echo "- Live homepage has not yet updated to the unbranded design (Chrome exit $code)." >> "$GITHUB_STEP_SUMMARY"
              grep -Eo '<main[^>]*>|<h1[^>]*>[^<]{0,180}|<title[^>]*>[^<]{0,180}' /tmp/novelhaven-dom.html | head -n 15 || true
              grep -Ei 'Uncaught|ERR_|error|failed|blocked|Refused|SyntaxError|ReferenceError|TypeError' /tmp/novelhaven-chrome-errors.log | head -n 25 || true
            fi
          done
      - name: Check actual source-update rows on the live homepage
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '"sourceActivityVerified":true' dist/source-activity.js; then
            echo "No recent source activity snapshot yet; cannot assert live chapter rows." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then
            echo "Cannot verify release rows without a browser." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for attempt in 1 2 3 4 5 6; do
            timeout 80s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
              --disable-background-networking --disable-extensions --virtual-time-budget=25000 \
              --dump-dom "https://novelhaven.top/" > /tmp/novelhaven-source-dom.html 2>/dev/null || true
            if grep -q 'home-release-row' /tmp/novelhaven-source-dom.html && \
               grep -q 'home-release-time' /tmp/novelhaven-source-dom.html; then
              echo "VERIFIED LIVE: NovelHaven homepage shows recent chapter rows with compact timestamps."
              echo "Verified live source-reported release rows in Chrome." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Source release rows not yet seen on live host (attempt $attempt)."
            sleep 12
          done
          echo "::warning::Live source-report release rows not verified yet; Cloudflare deployment may be pending."
          echo "Live release rows not yet verified; do not mark deployment complete." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify AkkNovel confirmed source release is present in Latest Releases
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=commonjs - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('/tmp/novelhaven-source-dom.html','utf8');
          const source=fs.readFileSync('dist/source-activity.js','utf8');
          const reports=source.match(/const reports = (\{.*?\});/s);
          if (!reports) throw new Error('No source-release snapshot in checkout');
          const data=JSON.parse(reports[1]);
          const target='freeloading-daily-but-the-system-makes-me-a-big-spender';
          if (!data[target]?.sourceReleaseAt) {
            console.log('AkkNovel sample has no confirmed source growth; skip live Akk row check.');
            process.exit(0);
          }
          const section=html.match(/<section class="home-feed-section home-release-section"[\s\S]*?<\/section>/);
          if (!section) throw new Error('Missing Latest Release Novels section in rendered DOM');
          if (!section[0].includes('class="home-release-row"') || !section[0].includes('/novel/'+target+'/')) {
            throw new Error('Confirmed AkkNovel source update missing from live Latest Release Novels.');
          }
          console.log('VERIFIED LIVE AKKNOVEL: new chapter appears in Latest Release Novels.');
          NODE
      - name: Report current live five-day release list
        shell: bash
        run: |
          node --input-type=commonjs - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('/tmp/novelhaven-source-dom.html','utf8');
          const section=html.match(/<section class="home-feed-section home-release-section"[\s\S]*?<\/section>/);
          if(!section){console.log('Live Latest Release section missing.');process.exitCode=1;}
          else {
            const rows=[...section[0].matchAll(/<a class="home-release-row" href="\/novel\/([^/]+)\//g)].map(m=>m[1]);
            console.log('LIVE RELEASE COUNT:',rows.length,'NOVELS:',JSON.stringify(rows));
            if(rows.length<2)console.log('WARNING: Live release count is below two; investigate deployment or source data.');
          }
          NODE
      - name: Verify visible release ages have no prefixes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=commonjs - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('/tmp/novelhaven-source-dom.html','utf8');
          const section=html.match(/<section class="home-feed-section home-release-section"[\s\S]*?<\/section>/);
          if(!section)throw new Error('Latest Release Novels section missing');
          const labels=[...section[0].matchAll(/<(?:time|span)\b[^>]*class="home-release-time"[^>]*>([^<]+)<\/(?:time|span)>/g)].map(x=>x[1].trim());
          if(labels.length===0)throw new Error('No time labels in release rows');
          const invalid=labels.filter(x=>! /^(?:Just now|Yesterday|\d+ (?:min|mins|hour|hours|day|days) ago)$/.test(x));
          console.log('LIVE COMPACT RELEASE LABELS:',JSON.stringify(labels.slice(0,20)));
          if(invalid.length)throw new Error('Unwanted prefix or unknown time label: '+JSON.stringify(invalid));
          NODE
      - name: Verify simple Latest and Completed novel directories
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER" || { echo "::warning::No Chrome for directory UI verification"; exit 1; }
          for route in latest-releases completed; do
            verified=0
            for attempt in 1 2 3 4 5; do
              timeout 70s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
                --disable-background-networking --disable-extensions --virtual-time-budget=17000 \
                --dump-dom "https://novelhaven.top/#/$route" > "/tmp/novelhaven-$route.html" 2>/dev/null || true
              if grep -q 'class="directory-switch"' "/tmp/novelhaven-$route.html" && \
                 grep -q '>Latest Novels</a>' "/tmp/novelhaven-$route.html" && \
                 grep -q '>Completed Novels</a>' "/tmp/novelhaven-$route.html" && \
                 ! grep -q -E 'Verified source chapter changes|New source chapters detected after|Source chapter updates · last 5 days|Finished stories' "/tmp/novelhaven-$route.html"; then
                verified=1
                break
              fi
              sleep 12
            done
            if [ "$verified" -ne 1 ]; then
              echo "::error::Clean novel-directory navigation is not verified on live $route route."
              exit 1
            fi
            echo "VERIFIED LIVE SIMPLE DIRECTORY: $route has only Latest Novels and Completed Novels navigation."
          done
      - name: Verify live Latest Novels shows genuinely recently updated titles
        shell: bash
        run: |
          set -euo pipefail
          expected_app="$(grep -o 'app.js?v=[^\"]*' dist/index.html | head -n 1)"
          test -n "$expected_app" || { echo 'Missing current application version'; exit 1; }
          for attempt in 1 2 3 4 5; do
            if ! grep -Fq "$expected_app" /tmp/novelhaven-source-dom.html; then
              echo "New Latest Novels script not yet visible on Cloudflare (attempt $attempt)."
              timeout 80s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
                --disable-background-networking --disable-extensions --virtual-time-budget=22000 \
                --dump-dom "https://novelhaven.top/" > /tmp/novelhaven-source-dom.html 2>/dev/null || true
              sleep 8
              continue
            fi
            break
          done
          node --input-type=commonjs - <<'NODE'
          const fs=require('node:fs'), html=fs.readFileSync('/tmp/novelhaven-source-dom.html','utf8');
          const current=fs.readFileSync('dist/index.html','utf8').match(/src="(app\.js\?v=[^"]+)"/)?.[1];
          if(!current || !html.includes(current))
            throw new Error('Cloudflare Latest Novels app.js does not match the current committed version');
          const released=[...html.matchAll(/class="home-release-row" href="\/novel\/([^/]+)\//g)].map(x=>x[1]);
          const i=html.indexOf('Latest Novels</h2>');
          if(i<0)throw new Error('Missing Latest Novels homepage section');
          const next=html.indexOf('</section>',i);
          const latest=[...html.slice(i,next<0?undefined:next).matchAll(/class="home-novel-tile" href="\/novel\/([^/]+)\//g)].map(x=>x[1]);
          console.log('LIVE LATEST NOVELS:',JSON.stringify(latest));
          console.log('LIVE RECENT SOURCE RELEASES:',released.length);
          const expected=released.slice(0,6);
          if(latest.length!==expected.length)
            throw new Error('Latest Novels rendered '+latest.length+' tiles; expected '+expected.length+' verified source updates');
          if(latest.some((id,index)=>id!==expected[index]))
            throw new Error('Latest Novels must show the six most recent source updates in chronological order, without imported older chapters');
          console.log('VERIFIED LIVE: Latest Novels displays source-updated novels only, in release order.');
          NODE
      - name: Verify live Library no-flicker scripts are deployed
        shell: bash
        run: |
          set -euo pipefail
          expected_app="$(grep -o 'app.js?v=[^\"]*' dist/index.html | head -n 1)"
          expected_accounts="$(grep -o 'accounts.js?v=[^\"]*' dist/index.html | head -n 1)"
          test -n "$expected_app" && test -n "$expected_accounts" || exit 1
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL --retry 2 --retry-delay 2 'https://novelhaven.top/library?live-check=1' > /tmp/novelhaven-library-html || true
            if grep -Fq "$expected_app" /tmp/novelhaven-library-html &&
               grep -Fq "$expected_accounts" /tmp/novelhaven-library-html; then
              echo 'VERIFIED LIVE: Cloudflare serves the Library flicker fix and updated account sync.'
              exit 0
            fi
            echo "Waiting for latest Library scripts on Cloudflare (attempt $attempt)"
            sleep 12
          done
          echo '::error::Latest no-flicker Library scripts not yet deployed on Cloudflare.'
          exit 1
