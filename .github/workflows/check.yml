name: Check and package website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify automatic publication safeguards
        run: python -m unittest discover -s scripts -p "test_publication_guard.py"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/*.test.mjs
      - run: node scripts/build.mjs
        env:
          NOVELNEST_CLOUDFLARE: '1'
      - run: node scripts/check-cloudflare-build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: NovelNest-website
          path: _cloudflare/
