name: Check and package website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify automatic publication safeguards
        run: python -m unittest discover -s scripts -p "test_publication_guard.py"
      - name: Install source activity test dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Test original-source activity parser
        run: python -m unittest discover -s scripts -p "test_source_activity_scan.py"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/*.test.mjs
      - run: node --check scripts/check-cloudflare-preview.mjs
      - run: node --check scripts/activate-compatible-pages.mjs
      - run: node --check scripts/guard-compatible-pages-production.mjs
      - run: node --check scripts/verify-live-source-feed.mjs
      - run: node scripts/build.mjs
        env:
          NOVELNEST_CLOUDFLARE: '1'
          CHAPTER_DUPLICATE_REPORT_PATH: chapter-duplicate-audit.json
      - run: node scripts/check-cloudflare-build.mjs
      - name: Save chapter repetition audit for targeted corrections
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-duplicate-audit
          path: chapter-duplicate-audit.json
          if-no-files-found: ignore
      - name: Build compatible Cloudflare Pages preview (no D1 cutover)
        run: node scripts/build-compatible-pages.mjs
      - name: Verify original reader and existing AdSense remain intact
        run: node scripts/check-compatible-pages.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: NovelNest-website
          path: _cloudflare/
