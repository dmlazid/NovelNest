name: Publish to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "dist/data/fwn-*-chapters-*.js"
      - "dist/assets/fwn-*.jpg"
      - "dist/licensed-fwn-*.js"
  workflow_run:
    workflows:
      - "Import licensed gallery novel"
      - "Import licensed Astral Pet Store"
      - "Import licensed Cultivation Online"
      - "Import licensed Investing novel"
      - "Import ongoing FreeWebNovel books"
      - "Import licensed Supreme Magus"
      - "Import licensed The Innkeeper"
      - "Import licensed AkkNovel series"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-live-v2
  # Finish the current deployment; newer updates wait instead of cancelling it.
  cancel-in-progress: false

jobs:
  deploy:
    # An updater may save valid checkpoints before failing or being cancelled.
    # Always validate current main; only a passing test/build can reach Deploy.
    environment:
      name: github-pages-live
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/*.test.mjs
      - run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

