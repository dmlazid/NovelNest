name: Discover next 15 novel candidates

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novel-candidate-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install discovery dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Discover popular FreeWebNovel candidates
        run: python scripts/discover_auto_novels.py freewebnovel
      - name: Discover popular AkkNovel candidates
        run: python scripts/discover_auto_novels.py akknovel
      - name: Save candidate queues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/candidates_freewebnovel.json scripts/candidates_akknovel.json
          if git diff --cached --quiet; then
            echo "No new candidates"
            exit 0
          fi
          git commit -m "Refresh popular novel candidate queues"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep 3
              continue
            fi
            if git push origin HEAD:main; then
              echo "Candidate queues updated"
              exit 0
            fi
            sleep 3
          done
          echo "Could not push candidate queues"
          exit 1
