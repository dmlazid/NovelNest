name: Verify public long-novel curation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-curated-fwn.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check real Cloudflare sitemap, direct novels and AdSense untouched
        shell: bash
        run: |
          set -euo pipefail
          archived=(martial-god-asura legend-of-swordsman martial-peak infinite-mana-in-the-apocalypse reborn-at-boot-camp-general-dont-mess-around chaotic-sword-god madams-identities-shocks-the-entire-city-again the-long-awaited-mr-han cultivation-chat-group fey-evolution-merchant)
          verified=0
          for attempt in 1 2 3 4 5 6; do
            stamp="$(date +%s)"
            curl -fsSL --max-time 25 "https://novelhaven.top/?audit=$stamp" -o /tmp/nh-index.html || true
            curl -fsSL --max-time 25 "https://novelhaven.top/sitemaps/catalog.xml?audit=$stamp" -o /tmp/nh-catalog.xml || true
            echo "Hosting check: built sitemap bytes=$(wc -c < /tmp/nh-catalog.xml)"
            if grep -Fq 'https://novelhaven.top/novel/shadow-slave/' /tmp/nh-catalog.xml; then
              echo "Mode: compiled Cloudflare site"
              for id in "${archived[@]}"; do
                if grep -Fq "https://novelhaven.top/novel/$id/" /tmp/nh-catalog.xml; then
                  echo "::error::Curated $id still in public sitemap"; exit 1
                fi
              done
              curl -fsSL --max-time 25 'https://novelhaven.top/novel/martial-god-asura/' -o /tmp/nh-curated-detail.html
              if grep -Fq 'name="robots" content="noindex,follow"' /tmp/nh-curated-detail.html &&
                grep -Fq 'chapter-1/' /tmp/nh-curated-detail.html; then
                echo 'VERIFIED LIVE: compiled site omits ten curated titles from sitemap while keeping direct reader links'
                verified=1
                break
              fi
            elif grep -Fq 'discovery-curation.js' /tmp/nh-index.html; then
              echo "Mode: Cloudflare Pages SPA fallback"
              curl -fsSL --max-time 25 'https://novelhaven.top/discovery-curation.js' -o /tmp/nh-curation.js
              curl -sSLD /tmp/nh-curated-headers -o /tmp/nh-curated-detail.html --max-time 25 'https://novelhaven.top/novel/martial-god-asura/'
              if grep -Fq 'martial-god-asura' /tmp/nh-curation.js &&
                grep -Fq 'fey-evolution-merchant' /tmp/nh-curation.js &&
                grep -qi '^x-robots-tag: noindex' /tmp/nh-curated-headers; then
                echo 'VERIFIED LIVE: SPA applies curated catalog and noindex headers to long novel routes'
                verified=1
                break
              fi
            fi
            echo "Waiting for live curation and noindex headers (attempt $attempt of 6)"
            sleep 15
          done
          if [ "$verified" != 1 ]; then
            echo "::error::Unable to confirm index exclusion and direct-reader noindex on the live hosting mode."
            exit 1
          fi
          curl -fsSL --max-time 30 "https://novelhaven.top/ads.txt" -o /tmp/nh-ads-txt
          grep -Fq 'google.com, pub-9356195452195758, DIRECT, f08c47fec0942fa0' /tmp/nh-ads-txt ||
            { echo "::error::Existing AdSense ads.txt record changed or missing."; exit 1; }
          echo "VERIFIED LIVE: curated book discovery/indexing rules active, ads.txt unchanged."
