name: Import licensed Supreme Magus
# Uses the shared NovelNest full-catch-up runner.

on:
  schedule:
    - cron: "37 */6 * * *"
  push:
    paths:
      - "scripts/import_supreme_magus.py"
      - "scripts/run_novel_catchup.sh"
      - ".github/workflows/import-supreme-magus.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # Stable per-source queue: do not version this name.
  group: novelnest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    # Migration freeze: remove this condition only after verified reader cutover.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Catch Supreme Magus up completely
        env:
          SUPREME_MAGUS_BATCH_SIZE: "100"
          IMPORT_NAME: "Supreme Magus"
          IMPORT_COMMAND: "python scripts/import_supreme_magus.py"
          IMPORT_GIT_PATHS: "dist/data/supreme-magus-chapters-*.js dist/data/supreme-magus-state.json dist/assets/supreme-magus.jpg dist/licensed-supreme-magus.js"
          IMPORT_MAX_CHECKPOINTS: "60"
          IMPORT_MAX_SECONDS: "9600"
          IMPORT_COMMIT_PREFIX: "Auto-update Supreme Magus chapters"
          IMPORT_RESCHEDULE: "false"
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/run_novel_catchup.sh

      - name: Record updater result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "Supreme Magus updater result: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "The importer continues until the source is caught up, saving every 100 chapters." >> "$GITHUB_STEP_SUMMARY"
