name: Import licensed Supreme Magus

on:
  schedule:
    - cron: "37 */6 * * *"
  push:
    paths:
      - "scripts/import_supreme_magus.py"
      - ".github/workflows/import-supreme-magus.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supreme-magus-freewebnovel-v1
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Import and checkpoint Supreme Magus
        env:
          SUPREME_MAGUS_BATCH_SIZE: "100"
          SUPREME_MAGUS_BATCHES_PER_RUN: "5"
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          batches="${SUPREME_MAGUS_BATCHES_PER_RUN:-5}"
          for batch in $(seq 1 "$batches"); do
            echo "=== Supreme Magus checkpoint $batch/$batches ==="
            python scripts/import_supreme_magus.py
            node scripts/check.mjs

            git add -A -- \
              dist/data/supreme-magus-chapters-*.js \
              dist/assets/supreme-magus.jpg \
              dist/licensed-supreme-magus.js \
              dist/index.html

            if git diff --cached --quiet; then
              echo "Supreme Magus is already caught up. Nothing else to commit."
              exit 0
            fi

            git commit -m "Auto-update Supreme Magus chapters (checkpoint $batch)"

            pushed=0
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "Push raced with another update; retrying ($attempt/3)..."
              sleep 2
            done

            if [ "$pushed" -ne 1 ]; then
              echo "Could not push Supreme Magus checkpoint after 3 attempts."
              exit 1
            fi
          done

      - name: Record updater result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "Supreme Magus updater result: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Each successful checkpoint is saved before the next batch begins." >> "$GITHUB_STEP_SUMMARY"
          echo "After the backlog is imported, the source is checked automatically every 6 hours." >> "$GITHUB_STEP_SUMMARY"
