name: Automatically sync published novel chapters to D1

# This is BACKGROUND MIGRATION ONLY; it never changes the live reader or AdSense.
# Before an approved multi-D1 pilot it uses the original database. After the
# first durable novel_shards route it automatically uses all five existing
# databases, with independent 380 MiB safety limits and chapter readback.
# Hourly batches of 350 balance migration speed with Free D1 query quotas,
# Cloudflare API rate limits, and resumable checkpoint safety.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/d1-auto-sync.yml"
      - "scripts/export-d1-batch.mjs"
      - "scripts/export-d1-batch.test.mjs"
      - "scripts/sync-d1-chapters.mjs"
      - "scripts/sync-d1-chapters.test.mjs"
      - "scripts/d1-auto-dispatch.mjs"
      - "scripts/d1-auto-dispatch.test.mjs"
      - "scripts/sync-d1-sharded.mjs"
      - "scripts/sync-d1-sharded.test.mjs"
      - "cloudflare/d1/shards.mjs"
      - "scripts/plan-d1-capacity.mjs"
      - "scripts/plan-d1-capacity.test.mjs"
      - "scripts/audit-d1-account.mjs"
      - "scripts/audit-d1-account.test.mjs"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview only, or safely copy published chapters into D1"
        required: true
        type: choice
        default: plan
        options:
          - plan
          - import
      max_chapters:
        description: "Maximum chapters per run (1-500)"
        required: true
        type: number
        default: 350

permissions:
  contents: read

# Share the lock with the earlier pilot so the two never write to D1 together.
concurrency:
  group: novelhaven-d1-chapter-pilot
  cancel-in-progress: false

jobs:
  sync-chapters:
    # Superseded by d1-fast-migration.yml with a shared daily quota ledger.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out published chapter sources
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify import safety and source chapter checks
        run: node --test scripts/export-d1-batch.test.mjs scripts/sync-d1-chapters.test.mjs scripts/plan-d1-capacity.test.mjs scripts/audit-d1-account.test.mjs scripts/sync-d1-sharded.test.mjs scripts/d1-auto-dispatch.test.mjs
      - name: Estimate D1 storage and future database needs (read-only)
        env:
          D1_CAPACITY_OUT: ${{ runner.temp }}/novelhaven-d1-capacity.json
        run: node scripts/plan-d1-capacity.mjs
      - name: Check available Cloudflare D1 database slots (read-only)
        env:
          D1_CAPACITY_OUT: ${{ runner.temp }}/novelhaven-d1-capacity.json
          D1_INVENTORY_OUT: ${{ runner.temp }}/novelhaven-d1-inventory.json
        run: node scripts/audit-d1-account.mjs
      - name: Import a capped number of already-published chapters (auto-select safe D1 strategy)
        env:
          D1_REPORT_PATH: ${{ runner.temp }}/novelhaven-d1-auto-sync.json
          SYNC_MODE: ${{ github.event_name != 'workflow_dispatch' && 'import' || inputs.mode || 'plan' }}
          SYNC_LIMIT: ${{ github.event_name == 'schedule' && '350' || inputs.max_chapters || '350' }}
        run: |
          set -euo pipefail
          node scripts/d1-auto-dispatch.mjs --mode "$SYNC_MODE" --max-chapters "$SYNC_LIMIT"
      - name: Upload safe statistics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novelhaven-d1-auto-sync-summary
          path: |
            ${{ runner.temp }}/novelhaven-d1-auto-sync.json
            ${{ runner.temp }}/novelhaven-d1-capacity.json
            ${{ runner.temp }}/novelhaven-d1-inventory.json
          if-no-files-found: ignore
          retention-days: 7
