name: Import licensed gallery novel

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "scripts/import_gallery.py"
      - ".github/workflows/import-gallery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Stable per-source queue: do not version this name.
  group: novelnest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate existing chapter data
        run: node scripts/check.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Check for and import new authorized chapters
        run: python scripts/import_gallery.py

      - name: Validate imported chapter data
        run: node scripts/check.mjs

      - name: Commit chapter updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/gallery-chapters-*.js
          git add dist/licensed-gallery.js
          if git diff --cached --quiet; then
            echo "No new chapter changes to commit."
            exit 0
          fi
          git commit -m "Auto-update licensed novel chapters"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Record updater result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "Chapter updater result: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Chapters are validated before committing. A failed check leaves the published library unchanged." >> "$GITHUB_STEP_SUMMARY"
