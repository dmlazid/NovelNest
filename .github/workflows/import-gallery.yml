name: Import licensed gallery novel

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "scripts/import_gallery.py"
      - ".github/workflows/import-gallery.yml"
      - "scripts/run_novel_catchup.sh"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # Stable per-source queue: do not version this name.
  group: novelnest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    # Chapter imports remain independent of the pending read-only D1 cutover.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate existing chapter data
        run: node scripts/check.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Catch Got a Gallery in the Wild up in validated chapter checkpoints
        env:
          GALLERY_BATCH_SIZE: "100"
          IMPORT_NAME: "Got a Gallery in the Wild"
          IMPORT_COMMAND: "python scripts/import_gallery.py"
          IMPORT_GIT_PATHS: "dist/data/gallery-chapters-*.js dist/licensed-gallery.js"
          IMPORT_MAX_CHECKPOINTS: "24"
          IMPORT_MAX_SECONDS: "4800"
          IMPORT_COMMIT_PREFIX: "Auto-update Got a Gallery in the Wild chapters"
          IMPORT_WORKFLOW: "import-gallery.yml"
          IMPORT_RESCHEDULE: "true"
          IMPORT_DEPLOY_EACH_CHECKPOINT: "false"
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/run_novel_catchup.sh

      - name: Record updater result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "Chapter updater result: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Chapters are validated before committing. A failed check leaves the published library unchanged." >> "$GITHUB_STEP_SUMMARY"
